<!DOCTYPE html>
<html>
  <head>
    <title>Calculator</title>
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <p>JavaScript Calculator.</p>

    <!-- The display screen -->
    <p class="display"></p>

    <!-- Row 1 -->
    <p>
      <button onclick="updateCalculation('1');">1</button>
      <button onclick="updateCalculation('2');">2</button>
      <button onclick="updateCalculation('3');">3</button>
      <button class="operator-button" onclick="updateCalculation(' + ');">+</button>
    </p>

    <!-- Row 2 -->
    <p>
      <button onclick="updateCalculation('4');">4</button>
      <button onclick="updateCalculation('5');">5</button>
      <button onclick="updateCalculation('6');">6</button>
      <button class="operator-button subtraction-button" onclick="updateCalculation(' - ');">-</button>
    </p>
    
    <!-- Row 3 -->
    <p>
      <button onclick="updateCalculation('7');">7</button>
      <button onclick="updateCalculation('8');">8</button>
      <button onclick="updateCalculation('9');">9</button>
      <button class="operator-button multiple-button" onclick="updateCalculation(' * ');">*</button>
    </p>
    
    <!-- Row 4 -->
    <p>
      <button onclick="updateCalculation('0');">0</button>
      <button class="dot-button" onclick="updateCalculation(' . ');">.</button>
      <button class="operator-button divide-button" onclick="updateCalculation(' / ');">/</button>
      <button class="calculate-button operator-button" onclick="calculateResult();">=</button>
    </p>

    <!-- Row 5 (The New Clear Button) -->
    <p>
      <button class="clear-button" onclick="clearCalculation();">Clear</button>
    </p>

    <!-- Link to your new external JavaScript file -->
    <script src="index.js"></script>
  </body>
</html>
